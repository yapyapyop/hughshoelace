<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hughshoelace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" id="site-favicon" type="image/png" href="/favicon.png">
</head>
<body>

<header class="topbar">
    <div class="logo">hugh<span class="color-text"><span>s</span><span>h</span><span>o</span><span>e</span><span>l</span><span>a</span><span>c</span><span>e</span></span></div>
</header>

<div class="main-content">
    <div class="quz-container">
        <div id="startScreen" class="start-screen">
            <div class="study-mode-indicator" id="modeIndicator">
                "Good design is as little design as possible."
            </div>
            <p class="start-description">
                From here you can visit:
            </p>
            <a href="https://revise.hughshoelace.com">revise - smart study tool</a>
            <div></div>
            <a href="https://retrograde.hughshoelace.com">RetroGrade -  rate your year</a>

            
        </div>
    </div>
</div>

<script>
(() => {
    const favicon = document.getElementById("site-favicon");
    const colors = ["#ef4444", "#f97316", "#facc15", "#22c55e", "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899"];
    const ctx = Object.assign(document.createElement("canvas"), { width: 32, height: 32 }).getContext("2d");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)");
    let i = 0, timer;

    const draw = () => {
        ctx.fillStyle = colors[i];
        ctx.fillRect(0, 0, 32, 32);
        favicon.href = ctx.canvas.toDataURL();
    };

    const sync = () => {
        clearInterval(timer);
        if (!reduced.matches && !document.hidden) {
            timer = setInterval(() => { i = (i + 1) % colors.length; draw(); }, 600);
        }
    };

    draw();
    sync();
    document.addEventListener("visibilitychange", sync);
    reduced.addEventListener("change", sync);
})();
</script>
</body>
</html>
