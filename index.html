<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>hughshoelace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
    
<header class="topbar">
    <div class="logo">hugh<span class="color-text"><span>s</span><span>h</span><span>o</span><span>e</span><span>l</span><span>a</span><span>c</span><span>e</span></span></div>
    </div>
</header>


<div class="main-content">
    <div class="quz-container">
        <div id="startScreen" class="start-screen">
            <div class="study-mode-indicator" id="modeIndicator">
                "Good design is as little design as possible."
            </div>
            <p class="start-description">
                From here you can visit:
            </p>
            <a href="url">revise - smart study tool</a>
            <div></div>
            <a href="url">RetroGrade -  rate your year</a>

            
        </div>

        <div id="quizScreen" style="display: none;">
            <div class="header">
                <h1 class="title" id="quizTitle">Biology Quiz</h1>
                <div class="study-mode-indicator" id="quizModeIndicator">
                    <i>Elimination Mode</i>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="question-counter" id="questionCounter"></div>
            </div>

            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback" style="display: none;"></div>

            <div>
                <button class="btn" id="nextBtn" disabled>Next Question</button>
            </div>
        </div>

        <div id="resultsScreen" style="display: none;">
            <div class="results">
                <h1 class="title">Study Session Complete!</h1>
                <div class="score" id="finalScore"></div>
                <div class="results-text" id="resultsText"></div>
                <button class="btn" id="reviewBtn" style="display: none;">Review Wrong Answers</button>
                <button class="btn" id="restartBtn">Start New Session</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js" type="module" defer></script>
</body>
</html>
